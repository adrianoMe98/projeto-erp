{% extends 'portal/base.html' %}

{% block title %}Novo Chamado - {{ cliente.nome_fantasia }}{% endblock %}

{% block content %}
<div class="page-header d-print-none mb-3">
    <div class="row align-items-center">
        <div class="col">
            <h2 class="page-title">Abrir Novo Chamado</h2>
        </div>
    </div>
</div>

<div class="row row-cards">
    <div class="col-12">
        <form method="post" class="card shadow-sm">
            {% csrf_token %}
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label required fw-bold">Título do Chamado</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Ex: Problema na OLT, Lentidão na VLAN 100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label required fw-bold">Descrição Detalhada</label>
                    <textarea name="descricao" class="form-control" rows="6" placeholder="Descreva o que está acontecendo com o máximo de detalhes..." required></textarea>
                </div>
            </div>
            <div class="card-footer text-end bg-transparent">
                <div class="d-flex">
                    <a href="{% url 'dashboard' %}" class="btn btn-link">Cancelar</a>
                    <button type="submit" class="btn btn-primary ms-auto">Registrar Chamado</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
