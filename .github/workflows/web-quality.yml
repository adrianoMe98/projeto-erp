name: Qualidade da reescrita Supabase
on:
  push:
    paths: ["web/**", "supabase/**", ".github/workflows/web-quality.yml"]
  pull_request:
    paths: ["web/**", "supabase/**", ".github/workflows/web-quality.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run db:start > /tmp/erp-supabase-start.log 2>&1
      - run: npm run test:db
      - run: npm run test:integration
